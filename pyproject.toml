[project]
name = "hiboo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mophe94", email = "dylan-bajeux@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hiboo = "hiboo:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]